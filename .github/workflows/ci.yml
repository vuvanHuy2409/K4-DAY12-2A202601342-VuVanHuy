name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests that do not require a live deployment
        env:
          API_TOKEN: ci-test-only
          REDIS_URL: fake://
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag l-gpt:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
    steps:
      - name: Trigger Railway deployment
        if: env.RAILWAY_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "$RAILWAY_DEPLOY_HOOK"
      - name: Skip deploy when hook is not configured
        if: env.RAILWAY_DEPLOY_HOOK == ''
        run: echo "RAILWAY_DEPLOY_HOOK is not configured; Railway GitHub auto-deploy remains active."
